services:
  - type: web
    name: tracksidelabs
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "bash scripts/start_render.sh"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.14"
      - key: USE_DB_STORAGE
        value: dual_write
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
    autoDeploy: true
  - type: cron
    name: preheat
    env: python
    plan: starter
    schedule: "*/5 * * * *"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python scripts/warmup_precompute.py --year 2026 --require-db"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.14"
      - key: USE_DB_STORAGE
        value: dual_write
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: TL_ADMIN_TOKEN
        sync: false
    autoDeploy: true
