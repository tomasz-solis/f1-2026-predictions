repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.6
    hooks:
      - id: ruff
        args: [--fix]
        exclude: ^notebooks/
      - id: ruff-format
        exclude: ^notebooks/
  - repo: local
    hooks:
      - id: mypy-dashboard-utils
        name: mypy (dashboard/utils + predictor guard)
        entry: .venv/bin/mypy --no-incremental src/dashboard src/utils src/predictors/baseline/data_mixin.py
        language: system
        pass_filenames: false
        require_serial: true
