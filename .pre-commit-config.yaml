repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.1
    hooks:
      - id: ruff
        args: [--fix]
        exclude: ^notebooks/
      - id: ruff-format
        exclude: ^notebooks/
  - repo: local
    hooks:
      - id: github-lint
        name: ruff check (GitHub lint parity)
        entry: ruff check src tests scripts app.py predict_weekend.py
        language: system
        pass_filenames: false
        require_serial: true
      - id: github-format-check
        name: ruff format --check (GitHub lint parity)
        entry: ruff format --check src tests scripts app.py predict_weekend.py
        language: system
        pass_filenames: false
        require_serial: true
      - id: github-typecheck
        name: mypy src (GitHub lint parity)
        entry: mypy src
        language: system
        pass_filenames: false
        require_serial: true
      - id: pytest-github-smoke
        name: pytest (GitHub smoke parity)
        entry: pytest tests/test_prediction_regression.py tests/test_backtesting.py tests/test_backtest_review_packet.py tests/test_prediction_context_runtime.py tests/test_generate_evaluation_report.py tests/test_race_grid_blending.py -q
        language: system
        pass_filenames: false
        require_serial: true
      - id: pytest-github-full
        name: pytest (GitHub full parity, manual)
        entry: pytest tests/ -v --cov=src --cov-report=xml --cov-report=term
        language: system
        pass_filenames: false
        require_serial: true
        stages: [manual]
