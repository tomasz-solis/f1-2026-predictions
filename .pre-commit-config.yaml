repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.6
    hooks:
      - id: ruff
        args: [--fix]
        exclude: ^notebooks/
      - id: ruff-format
        exclude: ^notebooks/
  - repo: local
    hooks:
      - id: mypy-src
        name: mypy (GitHub lint parity)
        entry: .venv/bin/mypy --no-incremental src
        language: system
        pass_filenames: false
        require_serial: true
      - id: pytest-github-smoke
        name: pytest (GitHub smoke parity)
        entry: make test-github-smoke
        language: system
        pass_filenames: false
        require_serial: true
