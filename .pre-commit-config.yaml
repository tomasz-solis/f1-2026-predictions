repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.6
    hooks:
      - id: ruff
        args: [--fix]
        exclude: ^notebooks/
      - id: ruff-format
        exclude: ^notebooks/
  - repo: local
    hooks:
      - id: mypy-dashboard-utils
        name: mypy (src/dashboard + src/utils)
        entry: .venv/bin/mypy src/dashboard src/utils
        language: system
        pass_filenames: false
        require_serial: true
