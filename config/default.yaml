# Formula 1 2026 Prediction Engine - Configuration

# Paths
paths:
  data_dir: "data"
  processed: "data/processed"
  raw: "data/raw"
  driver_chars: "data/processed/driver_characteristics.json"
  track_chars: "data/processed/track_characteristics.json"
  lineups: "data/current_lineups.json"
  cache: ".fastf1_cache"

grid:
  size: 22  # 11 teams x 2 drivers in the 2026 field

model:
  version: "2.2"

# Bayesian Model Parameters
bayesian:
  # Process noise injected between races to prevent overconfidence
  base_volatility: 0.1

  # Observation noise (higher = trust observations less)
  base_observation_noise: 2.0

  # Shock detection threshold (std devs)
  shock_threshold: 2.0

  # Shock multiplier for concept drift
  shock_multiplier: 0.5

  # Confidence weight for teammate-relative Bayesian updates
  teammate_relative_confidence: 0.35

  # Qualifying results are one lap in controlled conditions - noisier than race.
  qualifying_update_confidence: 0.15

  # Sprint races are ~1/3 race distance with less strategic variation.
  sprint_race_confidence: 0.20

  # runtime_skill_blend_weight is intentionally NOT set.
  # The updater persists Bayesian state (mu, sigma) only.
  # Prediction-time blending in _blend_race_skill_with_bayesian_form
  # is the single mechanism that mixes skill_score toward the posterior.

# Race Simulation Parameters
race:
  # Component weights
  weights:
    pace_weight: 0.4
    grid_weight: 0.3
    overtaking_weight: 0.15
    tire_deg_weight: 0.15

  # Base uncertainty (positions)
  base_uncertainty: 2.5

  # Uncertainty multipliers
  uncertainty_multipliers:
    rain: 1.5
    easy_overtaking: 0.8

  # Reliability
  dnf:
    base_risk: 0.05
    driver_error_factor: 0.15
    street_circuit_risk: 0.05
    rain_risk: 0.10

  # Lap 1 chaos
  lap1:
    midfield_variance: 1.5  # Positions 8-15
    front_row_variance: 0.0  # P1-P2 usually hold

  # Tire degradation
  tire:
    # Converts deg_factor to position penalty
    degradation_multiplier: 4.0
    skill_reduction_factor: 0.2

  # Weather impact
  weather:
    rain_position_swing: 6.0  # Good drivers gain 3, bad lose 3
    mixed_intensity: 0.5

  # Safety car
  safety_car:
    compression_factor: 0.1

  # Pace calculation
  pace:
    # Converts FP2 pace delta to position gain potential
    pace_delta_multiplier: 3.0

  # DNF handling
  dnf_position_penalty: 22  # Position penalty for DNF (grid size + 2)

# Qualifying Prediction Parameters
qualifying:
  # Blend weights (practice vs model)
  blend:
    default: 0.7
    fp3_only: 0.8
    fp1_only: 0.4

  # Session confidence weights
  session_confidence:
    fp1: 0.2
    fp2: 0.5
    fp3: 0.9
    sprint_quali: 0.85

  # Uncertainty
  base_uncertainty: 1.5

# Learning System Parameters
learning:
  # Rolling average window for method performance
  performance_window: 5

  # Min races before trusting a method
  min_samples: 3
  driver_error_scale: 0.18
  teammate_gap_scale: 0.10
  max_adjustment: 2.5
  # Interval calibration uses completed prediction residuals to apply a
  # conformal-style half-width floor when the published p5-p95 bands have been
  # empirically too tight.
  interval_min_samples: 20
  interval_target_coverage: 0.90
  interval_max_adjustment: 6.0

# Track Characteristics
track_defaults:
  pit_stop_loss: 22.0  # seconds
  safety_car_prob: 0.3
  overtaking_difficulty: 0.5

# Logging
logging:
  level: "INFO"
  format: "%(asctime)s | %(levelname)s | %(message)s"

# Dashboard runtime behaviors
dashboard:
  prediction_precompute:
    enabled: true
    horizon_races: 3
    weather_scenarios: ["dry", "mixed", "rain"]
    max_file_entries: 2048
    qualifying_n_simulations: 300
    race_n_simulations: 300
    reconcile_accuracy_after_warmup: true
    accuracy_reconcile_lookback_days: 14

# Baseline 2026 Predictor Parameters (used before real season data)
baseline_predictor:
  # Team-strength blending schedule across early season races.
  # rapid_adaptive reaches ~70-90% current-season influence by races 2-3.
  team_strength_schedule: rapid_adaptive
  baseline_learning_rate: 0.3
  current_season_form:
    infer_from_saved_actuals: true
    recency_exponent: 1.5
    stabilization_strength: 1.5
    saved_actual_race_weight: 0.70
  driver_form:
    bayesian_pace_blend_per_race: 0.20
    bayesian_pace_blend_cap: 0.60
    # Qualifying skill follows current-season Bayesian form quickly after each
    # completed weekend. 2026 sequential replay supports this for the one-lap
    # skill channel; race skill keeps the slower schedule below.
    bayesian_quali_skill_blend_per_race: 0.45
    bayesian_quali_skill_blend_cap: 0.90
    # Race skill stays independent from the qualifying skill schedule. When
    # these keys are absent, the race path falls back to the pace blend above.
    bayesian_race_skill_blend_per_race: 0.20
    bayesian_race_skill_blend_cap: 0.60
    quali_pace_update_blend: 0.30
    race_pace_update_blend: 0.25
    wet_skill_update_blend: 0.15    # EMA blend toward observed wet performance (halved for mixed)
    wet_skill_observation_scale: 0.40  # scales teammate-relative finish gap into wet_skill delta
  mixed_wet_blend: 0.50              # fraction of full wet effect applied in mixed conditions (shared by qualifying and race)

  # Qualifying simulation parameters
  qualifying:
    # Qualifying noise standard deviation (random variation)
    noise_std_sprint: 0.030    # Sprint weekends (less practice data)
    noise_std_normal: 0.026    # Normal weekends

    # Wet/mixed qualifying behaviour.
    # Wet qualifying increases noise (red flags, track evolution, aquaplaning risk)
    # and applies a per-driver wet_skill modifier that shifts their score relative
    # to their dry pace. wet_skill_neutral is the reference point - drivers above
    # it gain, drivers below it lose. Mixed blends dry and wet effects.
    wet_noise_multiplier: 1.60        # noise_std scale in pure wet qualifying
    mixed_noise_multiplier: 1.28      # noise_std scale in mixed conditions
    wet_skill_weight: 0.18            # how much wet_skill shifts the score
    sprint_wet_skill_scale: 0.75      # multiply wet_skill_weight by this for sprint qualifying
    wet_skill_neutral: 0.70           # wet_skill value that produces zero adjustment

    # Score composition weights
    team_weight: 0.60          # Car remains dominant, but driver form should still matter
    skill_weight: 0.40         # Driver one-lap signal (pace+skill)

    # Compress team spread before scoring.
    # 1.0 = raw team deltas, lower = closer field.
    team_strength_compression: 0.60
    # Converts the Phase 7 team-strength seconds delta into the existing
    # qualifying latent-score scale. The value is anchored to the frozen race
    # seconds slope so qualifying can use its own calibrated seconds spread
    # without changing the rest of the scoring model.
    team_strength_seconds_score_scale: 1.9707717329051126

    # Driver signal composition for qualifying
    driver_quali_pace_weight: 0.70
    driver_skill_weight: 0.30

    # Extra teammate divergence for setup/execution differences
    teammate_setup_std: 0.018
    driver_offset_cap: 0.22
    driver_signal_softness: 0.35
    weekend_form_std: 0.0
    recent_form_scale: 0.12
    recent_form_cap: 0.03
    model_only_team_weight_multiplier: 0.90
    model_only_skill_weight_multiplier: 1.10
    model_only_team_compression_multiplier: 0.87
    model_only_driver_offset_cap_multiplier: 1.10
    model_only_driver_signal_shrink: 0.35
    model_only_experience_shrink:
      rookie: 0.45
      second_year: 0.30
      developing: 0.20
      sunset: 0.05
      unknown: 0.30
    model_only_noise_multiplier: 1.12
    model_only_teammate_setup_multiplier: 1.10
    model_only_weekend_form_multiplier: 1.0
    model_only_teammate_anchor_experience_multiplier:
      rookie: 0.30
      second_year: 0.45
      developing: 0.55
      sunset: 1.00
      unknown: 0.45
    model_only_teammate_gap_cap_by_experience:
      rookie: 0.14
      second_year: 0.10
      developing: 0.08
      unknown: 0.10
    model_only_teammate_gap_cap_max_races_by_experience:
      rookie: 40
      second_year: 55
      developing: 55
      unknown: 45
    model_only_teammate_gap_cap_min_scale: 0.20
    model_only_negative_delta_threshold: 0.08
    model_only_negative_delta_shrink_scale: 1.0
    model_only_negative_delta_shrink_cap: 0.25

    # Program-aware testing/practice modifier
    # Uses short-run profile characteristics to make a small team-strength adjustment.
    testing_short_run_modifier_scale: 0.04
    preferred_short_run_compound: "SOFT"
    testing_fallback_min_teams: 8
    testing_fallback_absolute_blend_weight: 0.10
    testing_fallback_modifier_scale: 0.03
    testing_fallback_modifier_clip_range: [-0.015, 0.015]
    # Stored checkpoint profiles from the current weekend should matter more than
    # generic preseason/testing fallback. These scales let FP/SQ snapshot overlays
    # move team strength toward observed short-run pace without fully replacing priors.
    testing_fallback_checkpoint_blend_weight_scale: 0.65
    testing_fallback_checkpoint_blend_weight_cap: 0.55
    testing_fallback_checkpoint_modifier_scale: 0.10
    testing_fallback_checkpoint_modifier_cap: 0.08
    testing_fallback_checkpoint_clip_scale: 0.055
    testing_fallback_checkpoint_clip_cap: 0.045
    stored_checkpoint_blend_weight_multiplier: 1.12
    stored_checkpoint_blend_weight_cap: 0.90
    checkpoint_driver_profile_smoothing_seconds: 0.35
    checkpoint_driver_profile_quali_scale: 0.10
    checkpoint_driver_profile_skill_scale: 0.02
    testing_fallback_short_weight_min: 0.35
    testing_fallback_short_weight_max: 0.85
    testing_fallback_divergence_scale: 1.4
    # After the sprint race, the balanced checkpoint profile contains more race-style signal.
    # For main qualifying, keep fallback inference anchored to short-run pace only.
    testing_fallback_after_sprint_main_short_weight: 1.0
    # Soft teammate guard for testing-fallback mode.
    # Keeps early-weekend teammate flips possible, but requires stronger signal.
    testing_fallback_teammate_guard_enabled: true
    # Pre-weekend fallback can get too tidy when the only live signal is a stored
    # team profile. Keep the car anchor stronger than the driver signal so PRE
    # forecasts do not let a hot midfield driver profile overwhelm a clearly
    # faster car, while still leaving enough weekend spread for the field to mix
    # rather than falling into clean teammate ladders.
    testing_fallback_driver_signal_shrink: 0.02
    testing_fallback_driver_offset_cap_multiplier: 1.33
    testing_fallback_team_weight_multiplier: 1.10
    testing_fallback_skill_weight_multiplier: 0.90
    testing_fallback_team_compression_multiplier: 1.25
    testing_fallback_experience_shrink:
      rookie: 0.22
      second_year: 0.14
      developing: 0.09
      sunset: 0.03
      unknown: 0.14
    testing_fallback_teammate_anchor_scale: 0.05
    testing_fallback_teammate_anchor_cap: 0.02
    testing_fallback_teammate_anchor_experience_multiplier:
      rookie: 0.55
      second_year: 0.70
      developing: 0.80
      sunset: 1.00
      unknown: 0.70
    testing_fallback_teammate_setup_multiplier: 1.20
    testing_fallback_teammate_gap_cap_by_experience:
      rookie: 0.18
      second_year: 0.14
      developing: 0.12
      unknown: 0.14
    testing_fallback_teammate_gap_cap_max_races_by_experience:
      rookie: 55
      second_year: 80
      developing: 90
      unknown: 80
    testing_fallback_teammate_gap_cap_min_scale: 0.30
    testing_fallback_negative_delta_threshold: 0.08
    testing_fallback_negative_delta_shrink_scale: 1.00
    testing_fallback_negative_delta_shrink_cap: 0.18
    testing_fallback_noise_multiplier: 1.30
    testing_fallback_weekend_form_std_floor: 0.008

    # FP blend controls
    fp_blend_weight: 0.70
    fp_blend_weight_min: 0.45
    fp_blend_weight_max: 0.85
    fp_blend_confidence_scale: 0.30
    fp_blend_weight_testing: true
    practice_data_team_weight_multiplier: 0.94
    practice_data_skill_weight_multiplier: 1.12
    practice_data_team_compression_multiplier: 0.88
    practice_data_driver_offset_cap_multiplier: 1.33
    practice_data_teammate_setup_multiplier: 1.05

    # Data-quality confidence progression (used when no direct FP session confidence exists)
    data_confidence:
      model_only: 0.25
      testing_fallback: 0.45
      sprint_race: 0.70
    session_confidence_scale: 10.0

    # Confidence / fallback defaults
    confidence_cap: 60
    confidence_min: 40
    early_season_team_uncertainty:
      activation_floor: 0.22
      scale: 0.20
      decay_races: 3
      interval_positions_scale: 2.0
      confidence_penalty_scale: 6.0
    default_skill: 0.5
    default_team_strength: 0.5

    # Track-specific FP driver adjustment
    enable_driver_fp_adjustment: true
    driver_fp_adjustment_scale: 0.10
    driver_fp_adjustment_smoothing: 0.5
    qualifying_residual_model:
      enabled: false
      artifact_path: data/processed/model_artifacts/qualifying_residual/qualifying_residual_model.pkl
      clip_positions: 2.0
      allow_with_testing_seed: false

  # Compound selection parameters
  compound_selection:
    # Tire stress thresholds for compound selection (based on Pirelli data)
    high_stress_threshold: 3.5    # Above this: HARD compound (Bahrain, Singapore, Hungary)
    low_stress_threshold: 2.5     # Below this: SOFT compound (Monaco, Canada)
    default_stress_fallback: 3.0  # Default if stress metric missing (neutral)

  # Race simulation parameters
  race:
    # Defaults when an active-lineup driver is missing from characteristics
    default_experience_tier: developing
    missing_driver_teammate_weight: 0.75
    missing_driver_default_dnf_rate: 0.10
    missing_driver_rookie_dnf_penalty: 0.02
    missing_driver_rookie_quali_penalty: 0.08
    missing_driver_rookie_race_penalty: 0.07
    missing_driver_rookie_skill_penalty: 0.08
    missing_driver_rookie_overtaking_penalty: 0.06
    missing_driver_second_year_penalty_scale: 0.55

    # Weather-based base chaos (unpredictability)
    # Reduced from 0.35 to improve realism and reduce tail variance
    base_chaos:
      dry: 0.28                 # Dry conditions chaos level (down from 0.35)
      wet: 0.42                 # Wet conditions chaos level (down from 0.45)

    # Track chaos modifier
    # Harder to overtake (higher overtaking_difficulty) = lower chaos
    # Monaco (0.9) → 0.64x, Monza (0.2) → 0.92x
    track_chaos_multiplier: 0.4 # Multiplier applied to track overtaking difficulty

    # Safety car probabilities
    sc_base_probability:
      dry: 0.45                # Base safety car probability in dry
      wet: 0.70                # Base safety car probability in wet
    sc_track_modifier: 0.25    # Additional probability per overtaking difficulty

    # Grid position advantage
    grid_weight_min: 0.15      # Minimum grid weight (even on overtaking tracks)
    grid_weight_multiplier: 0.35  # Additional weight per track overtaking difficulty
                                  # Range: 0.15 (Monza) to 0.50 (Monaco)
    grid_divisor: 21           # Total grid size for normalization

    # Position scaling by grid slot (race-pace/overtake boost dampening)
    position_scaling:
      front_threshold: 3
      front_scale: 0.10
      upper_threshold: 7
      upper_scale: 0.30
      mid_threshold: 12
      mid_scale: 0.60
      back_scale: 1.00

    # Systematic race pace advantage
    # Drivers better in races (Alonso, Hamilton) vs quali specialists
    # Reduced from 0.5 → 0.15 to prevent unrealistic comebacks from midfield
    race_advantage_multiplier: 0.15  # Max ±0.15 swing from race_advantage

    # Overtaking skill boost
    # Only applies to drivers starting >5th on easy overtaking tracks (<0.5 difficulty)
    overtaking_skill_multiplier: 0.25  # Multiplier for (overtaking_skill - 0.5)
    overtaking_grid_threshold: 5       # Grid position threshold (>= this)
    overtaking_track_threshold: 0.5    # Track overtaking difficulty threshold (<= this)

    # Lap 1 chaos by grid position (random incidents/battles)
    # Reduced lap 1 chaos to improve front-runner stability
    lap1_chaos:
      front_row: 0.10          # P1-P3: safer, fewer battles (down from 0.15)
      upper_midfield: 0.28     # P4-P10: competitive battles (down from 0.32)
      midfield: 0.35           # P11-P15: most chaotic (down from 0.38)
      back_field: 0.25         # P16+: fewer competitors (down from 0.28)

    # Strategy variance
    # Less variance on Monaco (follow leader strategy), more on Bahrain
    strategy_variance_base: 0.30       # Base standard deviation
    strategy_track_modifier: 0.5       # Multiplier based on track overtaking
                                       # Monaco: 0.17, Bahrain: 0.24

    # Safety car luck (position swing when safety car deployed)
    safety_car_luck_range: 0.08  # narrow per-lap residual; main SC effect is field compression

    # Safety car mechanics.
    # pit_loss_reduction_s: seconds cut from pit stop loss when pitting under SC/VSC.
    # Under full SC cars slow to ~80 km/h; pit loss advantage is ~10-12s.
    # Under VSC the gain is smaller (~4-6s) since pace is limited but not SC-slow.
    sc_pit_loss_reduction_s: 12.0
    vsc_pit_loss_reduction_s: 5.0
    # Gap between cars after field compression when SC deploys.
    sc_compression_gap_s: 0.60
    # Fraction of tire-age increment applied during SC/VSC laps (pace is reduced).
    sc_tire_wear_fraction: 0.65

    # Pace weight in race scoring
    pace_weight_base: 0.40      # Base pace weight
    pace_weight_track_modifier: 0.10  # Reduced weight per track overtaking difficulty
                                      # Range: 0.30 (Monza) to 0.40 (Monaco)

    # Intra-team variance
    # Split between a persistent per-race setup offset and smaller lap-to-lap noise.
    teammate_variance_std: 0.13
    teammate_setup_offset_ratio: 0.30
    teammate_variance_lap_ratio: 0.45

    # DNF rate caps
    dnf_rate_historical_cap: 0.20  # Cap on historical DNF rate before team uncertainty adjustment
    dnf_rate_final_cap: 0.35       # Final maximum DNF probability per driver
    dnf_rate_floor: 0.02           # Minimum per-race DNF probability to avoid zero-risk overconfidence

    # Program-aware testing/practice modifier
    # Uses long-run profile characteristics to make a small team-strength adjustment.
    testing_long_run_modifier_scale: 0.05
    # Sprint weekends still use a predicted Sunday grid until main qualifying actually runs.
    # Cap confidence so the race model does not over-anchor to an inferred order.
    main_race_predicted_grid_sprint_confidence_cap: 0.55
    main_race_predicted_grid_sprint_confidence_caps_by_checkpoint:
      SQ: 0.50
      SPRINT: 0.65
    weekend_long_run_min_laps: 12     # Minimum stint length to treat laps as race-sim long run
    long_run_outlier_threshold: 1.5
    long_run_trim_ends: true

    # Shared testing profile configuration
    testing_profile_weights:
      short_run:
        overall_pace: 0.55
        top_speed: 0.20
        medium_corner_performance: 0.15
        fast_corner_performance: 0.10
      long_run:
        overall_pace: 0.50
        tire_deg_performance: 0.35
        consistency: 0.15
      balanced:
        overall_pace: 0.65
        tire_deg_performance: 0.20
        top_speed: 0.15

    # Bounds and thresholds for testing/profile modifiers and compound data reliability
    testing_modifier_clip_range: [-0.04, 0.04]
    min_laps_for_compound_data: 10

    # DNF and defensive-skill calibration
    team_uncertainty_dnf_multiplier: 0.20
    early_season_team_uncertainty:
      activation_floor: 0.22
      scale: 0.20
      decay_races: 3
      interval_positions_scale: 2.5
      confidence_penalty_scale: 5.0
    defensive_skill_weights:
      overtaking_component: 0.65
      skill_component: 0.35

    # Lap-by-lap simulation controls
    safety_car_trigger_lap: 10

    # 2026 overtaking model. DRS is gone; active aero now changes how close a
    # following car can stay through the wake before a pass.
    overtake_model:
      # Position-zone scaling (target car position) for pass realism:
      # harder at the front, easier in midfield/backfield.
      zone_front_threshold_boost: 0.22
      zone_upper_threshold_boost: 0.10
      zone_mid_threshold_boost: 0.02
      zone_back_threshold_boost: -0.03

      zone_front_probability_scale: 0.55
      zone_upper_probability_scale: 0.75
      zone_mid_probability_scale: 0.92
      zone_back_probability_scale: 1.08

      zone_front_bonus_scale: 0.55
      zone_upper_bonus_scale: 0.78
      zone_mid_bonus_scale: 0.93
      zone_back_bonus_scale: 1.05

    # Pit stop configuration
    pit_stops:
      loss_duration: 22.0              # seconds (track average pit stop time loss)
      overtake_loss_range: [0, 3]      # extra seconds if overtaken during stop (uniform random)

    # Tire strategy configuration
    tire_strategy:
      windows:
        one_stop: [23, 37]             # lap range for 1-stop window (60-lap race baseline)
        two_stop_first: [15, 25]       # first stop window for 2-stop strategy
        two_stop_second: [35, 45]      # second stop window for 2-stop strategy

      stop_probability:
        high_stress_2stop: 0.80        # >3.5 tire stress: 80% chance of 2-stop
        medium_stress_1stop: 0.90      # 2.5-3.5 tire stress: 90% chance of 1-stop
        low_stress_1stop: 0.95         # <2.5 tire stress: 95% chance of 1-stop

      compound_preferences:
        SOFT: 1.0                      # preference weight (higher = more likely)
        MEDIUM: 0.8
        HARD: 0.6

    # Sprint race compound distribution.
    # Based on 2024-2025 empirical data: MEDIUM ~88%, SOFT ~8%, HARD ~4%.
    # Softs appear from back-of-grid drivers attacking early; hards at high-stress tracks.
    sprint_compound:
      base_distribution:
        MEDIUM: 0.88
        SOFT: 0.08
        HARD: 0.04
      soft_lower_grid_bonus: 0.06   # added to SOFT weight for grid_pos > 10
      high_stress_threshold: 4.0    # stress above this shifts mass toward HARD
      high_stress_hard_shift: 0.08  # how much weight moves from SOFT/MEDIUM to HARD

    # Fuel effect configuration
    fuel:
      effect_per_lap: 0.035            # seconds per lap per 10kg fuel
      initial_load_kg: 110             # starting fuel load for 60-lap race
      burn_rate_kg_per_lap: 1.5        # fuel consumption per lap
      deg_multiplier: 0.10             # 10% worse tire deg when fully fueled

    # Track temperature resolution for tire model realism.
    # Final value can blend latest completed session weather with race-weather fallback.
    track_temperature:
      session_weather_enabled: true
      dry_c: 36.0
      mixed_c: 29.0
      rain_c: 23.0
      min_c: 5.0
      max_c: 65.0
      air_to_track_offset_c: 9.0
      blend:
        enabled: true
        session_weight: 0.70
        session_weight_by_session:
          R: 0.90
          Q: 0.80
          Sprint: 0.80
          SQ: 0.75
          FP3: 0.70
          FP2: 0.65
          FP1: 0.60

    # Non-competitive (practice) weather features used to modulate race uncertainty.
    # The weather selector still defines scenario; these are context modifiers only.
    weather_features:
      session_weather_enabled: true
      mismatch:
        chaos_boost: 0.18
        variance_boost: 0.10
        confidence_penalty: 2.0

    # Tire degradation and fresh tire effects
    tire_physics:
      fresh_tire_advantage:
        SOFT: 0.5                      # seconds/lap advantage for fresh SOFT tires
        MEDIUM: 0.3                    # seconds/lap advantage for fresh MEDIUM tires
        HARD: 0.1                      # seconds/lap advantage for fresh HARD tires

      fresh_tire_duration:
        SOFT: 3                        # laps that fresh tire advantage lasts
        MEDIUM: 3
        HARD: 2

      default_deg_slope: 0.15          # default tire_deg_slope if missing data
      traffic_deg_penalty: 0.05        # 5% worse tire life in dirty air (P16+)
      clean_air_bonus: 0.05            # 5% better tire life for leaders (P1-P5)

      # Tire cliff: beyond max age, degradation accelerates sharply
      # Max ages calibrated against 2022-2024 Pirelli tyre data (18-inch era).
      # SOFT 24, MEDIUM 34, HARD 42 represent median cliff onset observed across
      # tracks with average-to-high thermal stress. High-deg circuits (Bahrain,
      # Spain) hit the cliff earlier; low-deg circuits (Monaco) later. Per-circuit
      # compound data in car_characteristics overrides these when enough laps exist.
      # cliff_multiplier: 2.8 - degradation rate multiplies by this factor beyond
      # max age. Calibrated to produce ~1 - 3s pace loss per lap in the cliff zone,
      # consistent with observed F1 radio calls and strategy decisions when teams
      # are clearly managing tyres past their window.
      compound_max_age:
        SOFT: 24                       # laps before cliff onset
        MEDIUM: 34                     # laps before cliff onset
        HARD: 42                       # laps before cliff onset
      cliff_multiplier: 2.8            # deg slope multiplied by this beyond max age
      # Per-track cliff age scaling.
      # Higher tire stress (Bahrain ~4.5) pulls cliff in; lower (Monaco ~1.8) extends it.
      # stress_cliff_sensitivity: each unit above/below 3.0 shifts cliff age by this fraction.
      # cliff_reference_temp_c: baseline track temperature for cliff age calculation.
      # cliff_temp_sensitivity: fraction of cliff age lost per degree above reference.
      stress_cliff_sensitivity: 0.10
      cliff_reference_temp_c: 35.0
      cliff_temp_sensitivity: 0.008

    # Lap time modeling
    lap_time:
      reference_base: 90.0             # baseline lap time (seconds) - generic
      team_pace_penalty_range: 5.0    # worst team is +5.0s slower than best
      skill_improvement_max: 0.75      # max lap time improvement from driver skill
      team_strength_compression: 0.35  # compress car spread in race pace conversion
      elite_skill_threshold: 0.88      # only exceptional drivers get extra race-craft pace bonus
      elite_skill_lap_bonus_max: 0.22  # max additional sec/lap improvement at skill=1.0 (up from 0.15)
      elite_skill_exponent: 0.85       # concave curve: diminishing returns at the very top
      bounds: [70.0, 120.0]            # min/max lap time clamps (safety)
      # Per-lap seconds impact from wet_skill deviation from neutral.
      # At 0.80, a driver at 0.90 wet_skill gains 0.16s/lap over neutral,
      # accumulating to ~9.1s over 57 laps (typical race distance).
      # Pairwise noise (sqrt(2)*0.42) accumulates to ~4.5s, giving
      # signal-to-noise of ~2.0 sigma - dominant in wet conditions,
      # which matches F1 reality where wet skill is the primary
      # differentiator in rain races.
      # Qualifying uses 0.18 (higher signal in single-lap format).
      wet_skill_lap_weight: 0.80
      # Neutral set at 0.70 (not 0.50) because F1 drivers are a
      # pre-selected population - the typical F1 driver is above-average
      # at wet driving. Most drivers cluster here; only drivers with
      # clear evidence of above/below-average wet ability deviate.
      wet_skill_neutral: 0.70
      # Track-specific wet severity: street circuits amplify wet effects.
      # Derived as base + (track_overtaking * scale) when not set per-track.
      # Monaco (0.9 overtaking) → 1.16x; Monza (0.2) → 0.88x.
      track_wet_severity_base: 0.80
      track_wet_severity_scale: 0.40

    # Driver race-pace signal impact per lap (higher = more racecraft influence)
    race_advantage_lap_impact: 0.20

    # How much qualifying-grid uncertainty should carry into the race model.
    # Wide checkpoint-based grids should still matter, but they should not make
    # the race intervals explode on top of normal race variance.
    grid_uncertainty:
      base_std: 0.25
      interval_divisor: 4.5
      confidence_scale: 0.75
      input_confidence_scale: 0.30
      position_delta_scale: 0.20

    # Final ranking blend after lap-by-lap simulation
    # Keep sprint races grid-stable, but allow main races to evolve from qualifying.
    grid_anchor:
      base: 0.28
      track_scale: 0.36
      min: 0.42
      # Capped from the 2026 completed-race movement check: the previous 0.62
      # over-anchored full-distance median race order to predicted qualifying.
      main_max: 0.57
      sprint_min: 0.85
      low_confidence_scale: 0.30

    # Extra damping when the starting grid is itself probabilistic.
    # This keeps low-confidence checkpoint race runs from compounding grid
    # uncertainty and race variance into overly wide finish ranges.
    predicted_grid_uncertainty:
      activation_width: 2.0
      width_scale: 5.0
      anchor_scale: 0.18
      racecraft_damp_scale: 0.24
      max_gain_damp_scale: 0.30

    # Guardrail to prevent over-anchoring in full-distance races.
    # If movement is too low, re-rank with an upside quantile from simulation samples.
    main_race_movement_floor: 0.70
    main_race_movement_floor_track_scale: 0.25  # scales floor upward for low-overtaking tracks
    main_race_movement_quantile: 20.0

    # Low-confidence interval floor for top positions.
    # Prevents pathological point ranges (for example P1-P1) when the run is
    # explicitly marked as low-confidence due to missing/weak weekend inputs.
    position_interval_floor:
      apply_below_input_confidence: 0.65
      top_n: 3
      min_width: 1
      max_extra_width: 1

    # Regulation-transition blend for track overtaking difficulty.
    # Early 2026 observations should move historical priors gradually, not jump.
    overtaking_transition:
      min_observed_weight: 0.12
      max_observed_weight: 0.65
      races_to_full_weight: 8
      max_delta_from_prior: 0.25

    final_blend:
      overtaking_skill_scale: 1.0       # Down from 1.3 - reduce driver adjustment magnitude
      race_advantage_scale: 0.8         # Down from 1.0 - moderate race pace impact
      driver_skill_scale: 0.6           # Down from 0.7 - reduce skill adjustment
      low_confidence_racecraft_floor: 0.50
      low_confidence_max_gain_floor: 0.55
      elite_driver_skill_threshold: 0.88
      elite_driver_scale: 1.2           # Down from 1.6 - less extreme elite advantage
      elite_driver_exponent: 1.35
      max_driver_adjustment_positions: 1.2  # Keep driver adjustments meaningful without inflating recoveries
      # Hard cap on total gains from starting position.
      # Prevents unrealistic outcomes such as P22 -> P1 in a normal race.
      max_gain_base: 4.5
      max_gain_track_scale: 3.0
      max_gain_overtaking_skill_scale: 1.5
      max_gain_race_advantage_scale: 1.5
      max_gain_floor: 4.0
      max_gain_ceiling: 11.0
      hypothetical_points_floor:
        portable_skill_threshold: 0.70
        top_grid_limit: 10
        team_strength_threshold: 0.50
        dnf_probability_cap: 0.12

    podium_probability:
      min_sample_count: 250
      resample_seed_offset: 99173
      enforce_monotonic: true

    # Pit strategy constraints
    strategy_constraints:
      min_pit_lap: 5                   # earliest lap for pit stop
      max_pit_lap_from_end: 5          # don't pit in last N laps
      min_laps_between_stops: 8        # minimum stint length (consecutive stops)

      pit_lap_variance:
        one_stop: 3.0                  # ±3 lap variance for 1-stop window
        two_stop: 2.0                  # ±2 lap variance for 2-stop windows

      strategy_optimality: 0.60        # 60% optimal, 40% suboptimal (realism)
    race_residual_model:
      enabled: false
      artifact_path: data/processed/model_artifacts/race_residual/race_residual_model.pkl
      clip_positions_gained: 2.5
      positions_to_race_advantage_scale: 0.05
      allow_with_testing_seed: false

  conformal_calibration:
    enabled: false
    artifact_path: data/processed/model_artifacts/conformal_calibration/conformal_calibration.json
    min_samples: 20

  # Dashboard auto-capture settings for completed FP sessions
  practice_capture:
    new_weight: 0.25
    directionality_scale: 0.08
    session_aggregation: "laps_weighted"
    run_profile: "balanced"

  # Compound characteristics blend weights
  # How much to weight new session data vs existing compound data
  compound_blend_weights:
    # Practice sessions (exploratory, varied fuel loads)
    practice: 0.30              # 30% new, 70% existing
    # Sprint race (competitive but short)
    sprint: 0.50                # 50% new, 50% existing
    # Main race (most reliable, full commitment)
    race: 0.70                  # 70% new, 30% existing

# Testing
testing:
  seed: 42
  monte_carlo_runs: 100
